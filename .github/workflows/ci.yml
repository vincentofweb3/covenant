name: covenant-ci

on:
  push:
  pull_request:

jobs:
  direct:
    name: preflight + lint + direct tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache the GenVM bundle
        uses: actions/cache@v4
        with:
          path: ~/.cache/gltest-direct/genvm-universal-v0.3.0-rc7.tar.xz
          key: genvm-v0.3.0-rc7-runners-all-e218a185

      - name: Fetch the GenVM bundle
        # The v0.3.0-rc7 release no longer publishes genvm-universal.tar.xz.
        # genvm-runners-all.tar.xz is the same 134,842,512-byte bundle under a
        # new name, so stage it at the path gltest expects before any deploy.
        run: |
          target="$HOME/.cache/gltest-direct/genvm-universal-v0.3.0-rc7.tar.xz"
          mkdir -p "$(dirname "$target")"
          if [ ! -f "$target" ]; then
            curl -fL --retry 5 --retry-delay 2 \
              -o "$target" \
              "https://github.com/genlayerlabs/genvm/releases/download/v0.3.0-rc7/genvm-runners-all.tar.xz"
          fi
          echo "e218a1854214681560351051f76fe2b878545cf3409455ef372d57014a88ca67  $target" | sha256sum -c -

      - name: Preflight invariants and secret scan
        # Dependency-free and before the toolchain is installed: it must catch a
        # broken runtime pin early.
        run: python3 scripts/preflight.py

      - name: Install toolchain
        run: |
          python -m pip install --upgrade pip
          pip install --retries 5 --timeout 60 -r requirements-test.txt

      - name: Python compilation
        run: python -m compileall -q contracts scripts tests

      - name: genvm-lint
        # GENVM_VERSION is mandatory. Without it genvm-lint resolves the newest
        # cached GenVM bundle, which on a fresh runner is the newer generation
        # and does not ship this contract's runner -- the check fails with
        # "runners/py-genlayer/... not found". state/MEMORY.md §11.
        env:
          GENVM_VERSION: v0.3.0-rc7
        run: |
          genvm-lint lint contracts/covenant_guard.py
          genvm-lint lint contracts/treasury_vault.py
          genvm-lint check contracts/covenant_guard.py
          genvm-lint check contracts/treasury_vault.py

      - name: covctl self-test
        run: python3 scripts/covctl.py selftest

      - name: Direct-mode tests
        run: python3 -m pytest tests/direct -q

  integration:
    name: glsim lifecycle and consensus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache the GenVM bundle
        uses: actions/cache@v4
        with:
          path: ~/.cache/gltest-direct/genvm-universal-v0.3.0-rc7.tar.xz
          key: genvm-v0.3.0-rc7-runners-all-e218a185

      - name: Fetch the GenVM bundle
        # The v0.3.0-rc7 release no longer publishes genvm-universal.tar.xz.
        # genvm-runners-all.tar.xz is the same 134,842,512-byte bundle under a
        # new name, so stage it at the path gltest expects before any deploy.
        run: |
          target="$HOME/.cache/gltest-direct/genvm-universal-v0.3.0-rc7.tar.xz"
          mkdir -p "$(dirname "$target")"
          if [ ! -f "$target" ]; then
            curl -fL --retry 5 --retry-delay 2 \
              -o "$target" \
              "https://github.com/genlayerlabs/genvm/releases/download/v0.3.0-rc7/genvm-runners-all.tar.xz"
          fi
          echo "e218a1854214681560351051f76fe2b878545cf3409455ef372d57014a88ca67  $target" | sha256sum -c -

      - name: Preflight invariants and secret scan
        run: python3 scripts/preflight.py

      - name: Install toolchain
        run: |
          python -m pip install --upgrade pip
          pip install --retries 5 --timeout 60 -r requirements-integration.txt

      - name: Python compilation
        run: python -m compileall -q contracts scripts tests

      - name: Cross-contract and consensus tests
        # In-process simulator. No network, no keys, no secrets.
        run: python3 -m pytest tests/integration -q
